spring.datasource.url=jdbc:h2:mem:tdc;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS tdcbd
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.liquibase.enabled=false
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

jwt.token.secret=test-secret-that-is-long-enough-for-hs256-signing
jwt.token.expired=3600000
app.cors.allowed-origins=http://localhost:3000
app.upload.dir=${java.io.tmpdir}/tdc-test-uploads
app.admin.username=admin
app.admin.password=admin-password
