# All secrets come from environment variables; see .env.example and README.md.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tdc}
spring.datasource.username=${DB_USERNAME:tdc}
spring.datasource.password=${DB_PASSWORD}

# Entities live in the "tdcbd" schema. Hibernate creates/updates it until a Liquibase baseline exists
# (the old changelog in liquibase/ is kept for reference but fully commented out).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.liquibase.enabled=false

spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# JWT: the secret must be at least 32 bytes (HS256)
jwt.token.secret=${JWT_SECRET}
jwt.token.expired=${JWT_EXPIRATION_MS:36000000}

# Comma-separated list of front-end origins allowed to call the API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Uploaded profile photos
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Optional first admin, created on startup when both are set
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.email=${ADMIN_EMAIL:admin@localhost}
