services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tdc
      POSTGRES_USER: ${DB_USERNAME:-tdc}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
