version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Spring Boot 3 / Jakarta EE is a manual migration
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      maven:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: front
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: katalon
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
