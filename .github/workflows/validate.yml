name: validate

on:
  push:
    branches: [ katalon ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xmllint
        run: sudo apt-get update -q && sudo apt-get install -yq libxml2-utils
      - name: Check that Katalon project files are well-formed XML
        run: |
          find . -path ./.git -prune -o -type f \
            \( -name '*.rs' -o -name '*.prj' -o -name '*.glbl' -o -name '*.ts' -o -name '*.tc' \) \
            -print0 | xargs -0 --no-run-if-empty xmllint --noout
      - name: Check that no Katalon login token is committed
        run: |
          if grep -rIlE --exclude-dir=.git '^analytics\.authentication\.token=.' .; then
            echo "::error::Katalon TestOps token found in the files above"
            exit 1
          fi
