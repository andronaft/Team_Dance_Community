name: build

on:
  push:
    branches: [ front ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # node-sass 4.13 from yarn.lock has prebuilt binaries only up to Node 12
          node-version: 12
          cache: yarn
      - name: Install
        run: yarn install --frozen-lockfile --non-interactive
      - name: Build
        run: yarn build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
